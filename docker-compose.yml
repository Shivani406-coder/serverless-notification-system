services:
  localstack:
    image: localstack/localstack:latest
    container_name: notification-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: "sns,sqs,sts"
      DEBUG: "0"
      PERSISTENCE: "1"
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "./localstack/init:/etc/localstack/init/ready.d"
      - "localstack_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - awslocal sts get-caller-identity >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: notification-web
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      LOCALSTACK_ENDPOINT_URL: "http://localstack:4566"
      AWS_DEFAULT_REGION: "us-east-1"
      SNS_AWS_REGION: "ap-southeast-2"
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  localstack_data: